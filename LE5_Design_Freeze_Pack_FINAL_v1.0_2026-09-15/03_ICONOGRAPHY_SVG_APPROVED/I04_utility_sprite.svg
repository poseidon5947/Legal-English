<symbol id="chevron" viewBox="0 0 24 24"><path class="icon" d="m9 5 7 7-7 7"/><path class="accent-stroke" d="m12 5 7 7-7 7"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path class="icon" d="m6 6 12 12M18 6 6 18"/><path class="accent-stroke" d="m7.5 16.5 9-9"/></symbol>
<symbol id="completion" viewBox="0 0 24 24"><circle class="icon" cx="12" cy="12" r="8"/><path class="accent-stroke" d="m8.5 12.5 2.3 2.3 4.7-5.3"/></symbol>
<symbol id="external-link" viewBox="0 0 24 24"><path class="icon" d="M13 5H5v14h14v-8"/><path class="accent-stroke" d="M13 4h7v7M20 4l-9 9"/></symbol>
<symbol id="language" viewBox="0 0 24 24"><circle class="icon" cx="12" cy="12" r="8"/><path class="icon" d="M4 12h16M12 4a13 13 0 0 1 0 16M12 4a13 13 0 0 0 0 16"/><circle class="accent-fill" cx="18" cy="16.5" r="2"/></symbol>
<symbol id="menu" viewBox="0 0 24 24"><path class="icon" d="M5 7h14M5 12h14M5 17h14"/><path class="accent-stroke" d="M7 12h10"/></symbol>
