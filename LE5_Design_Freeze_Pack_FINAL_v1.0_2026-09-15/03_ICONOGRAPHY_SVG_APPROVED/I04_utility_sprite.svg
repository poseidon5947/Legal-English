<symbol id="pause" viewBox="0 0 24 24"><path class="icon" d="M8 5v14M16 5v14"/><path class="accent-stroke" d="M10 6v12M14 6v12"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path class="icon" d="M7 5v14l11-7z"/><path class="accent-fill" d="M9 8.5v7l5.5-3.5z"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle class="icon" cx="10.5" cy="10.5" r="5.5"/><path class="icon" d="m15 15 5 5"/><path class="accent-stroke" d="M8 9.5a3 3 0 0 1 2.5-2.5"/></symbol>
