<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none">
<style>
.icon{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.accent-stroke{fill:none;stroke:#F5E400;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.accent-fill{fill:#F5E400;stroke:none}
</style>
<defs>
